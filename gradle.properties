# Project-wide Gradle settings.
#
# Required toolchain (锁定后请勿随意改动):
#   - Gradle 8.9   (由 gradle/wrapper/gradle-wrapper.properties 锁定)
#   - AGP 8.1.0    (root build.gradle classpath)
#   - Kotlin 1.9.0
#   - JDK 17       (AGP 8.x 强制要求; AS -> Settings -> Build Tools -> Gradle -> Gradle JDK 选 17)
#   - Android Studio Giraffe (2022.3.1) 或更新; AS 2022.1/2022.2 不支持 AGP 8.1
#
android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx4096m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
android.injected.testOnly=false

